name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tooling
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: End-to-end browser tests
        run: npm run e2e
      - name: Audit live domain (evidence only; not a deployment gate)
        run: npm run audit:live
        continue-on-error: true
      - name: Audit live responsive pages and capture screenshots (evidence only)
        run: npm run audit:live-mobile
        continue-on-error: true
      - name: Verify Google indexing technical readiness
        run: npm run audit:indexing-readiness
      - name: Validate commercial SEO target intents and buyer information
        run: npm run audit:commercial-seo
      - name: Verify Phase 3 content actually deployed (evidence, not code gate)
        run: npm run audit:live-commercial
        continue-on-error: true
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-evidence
          path: |
            test-results/
            playwright-report/
            phase1-live-audit.json
            phase2-indexing-readiness.json
            phase3-commercial-audit.json
            phase3-live-content-audit.json
          if-no-files-found: ignore
